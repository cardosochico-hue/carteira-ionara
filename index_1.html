<title>Norte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0e14;
    --bg-2:#0d1119;
    --surface:#141a24;
    --surface-2:#1a2230;
    --surface-3:#212a3a;
    --border:#232b3a;
    --border-soft:#1c2331;
    --text:#f5f7fa;
    --text-2:#9aa3b7;
    --text-3:#5b6478;
    --accent:#ffffff;
    --accent-soft:rgba(255,255,255,0.08);
    --accent-line:rgba(255,255,255,0.35);
    --good:#0ca30c;
    --critical:#e2645f;
    --s1:#3987e5; /* Renda fixa pós-fixada */
    --s2:#d95926; /* Renda fixa inflação/pré */
    --s3:#199e70; /* Ações Brasil */
    --s4:#c98500; /* Fundos imobiliários */
    --s5:#d55181; /* Internacional */
    --s6:#008300; /* Alternativos */
    --s7:#9085e9; /* Previdência privada */
    --font-display:'Space Grotesk', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:rgba(255,255,255,0.18); }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  a{ color:var(--text); }
  h1,h2,h3{ font-family:var(--font-display); margin:0; text-wrap:balance; }
  .tabular{ font-variant-numeric:tabular-nums; }

  .page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px 80px;
    overflow-x:hidden;
  }
  .page::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(560px 420px at 18% -6%, rgba(144,133,233,0.14), transparent 60%),
      radial-gradient(680px 520px at 100% 12%, rgba(57,135,229,0.10), transparent 60%),
      var(--bg-2);
    z-index:-1;
  }

  .brand{
    width:100%;
    max-width:460px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand .word{ font-family:var(--font-display); font-weight:600; font-size:17px; letter-spacing:0.2px; }
  .brand .tag{ font-size:11px; color:var(--text-3); }

  .shell{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:26px 24px 24px;
    box-shadow:0 40px 80px -40px rgba(0,0,0,0.6);
  }

  .stephead{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .backbtn{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .backbtn:hover{ background:var(--surface-3); }
  .backbtn:focus-visible, button:focus-visible, .opt:focus-visible, .chip:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  h1.title{ font-size:23px; font-weight:600; }
  .sub{ font-size:13.5px; color:var(--text-2); line-height:1.55; margin:8px 0 0; }

  .progress-row{ display:flex; align-items:center; gap:8px; margin:18px 0 22px; }
  .progress-track{ flex:1; height:5px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width 0.25s ease; }
  .progress-label{ font-size:11.5px; color:var(--text-3); white-space:nowrap; }

  .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .field label{ font-size:11.5px; color:var(--text-2); font-weight:700; letter-spacing:0.3px; }
  .field input{
    height:50px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:var(--font-body);
    font-size:15px; padding:0 14px; width:100%;
  }
  .field input:focus{ outline:none; border-color:var(--accent-line); background:var(--surface-3); }
  .field.money input{
    height:64px; font-family:var(--font-display); font-size:23px; font-weight:600;
    border-color:var(--accent-line); background:var(--accent-soft);
  }
  .hint{ font-size:11.5px; color:var(--text-3); }

  .qcard{ display:flex; flex-direction:column; gap:12px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; padding:16px; margin-bottom:14px; }
  .qcard .qtext{ font-size:13.5px; font-weight:700; line-height:1.4; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    min-height:44px; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-3); color:var(--text-2); font-family:var(--font-body); font-size:13px; font-weight:600;
    cursor:pointer; display:flex; align-items:center;
  }
  .chip:hover{ border-color:var(--text-3); }
  .chip[aria-pressed="true"]{ border-color:var(--accent-line); background:var(--accent-soft); color:var(--text); }

  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    display:flex; align-items:center; gap:12px; min-height:48px; padding:12px 14px;
    border-radius:12px; border:1px solid var(--border); background:var(--surface-3);
    cursor:pointer; text-align:left; font-family:var(--font-body); color:var(--text-2); font-size:13px;
  }
  .opt:hover{ border-color:var(--text-3); }
  .opt[aria-pressed="true"]{ border-color:var(--accent-line); background:var(--accent-soft); color:var(--text); }
  .opt .dot{ width:18px; height:18px; border-radius:50%; border:1.6px solid var(--text-3); flex-shrink:0; }
  .opt[aria-pressed="true"] .dot{ border:5px solid var(--accent); }

  .btn{
    height:52px; border-radius:14px; border:none; font-family:var(--font-body); font-weight:700;
    font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:#0b0e14; }
  .btn-primary:hover:not(:disabled){ background:#e7e9ee; }
  .btn-ghost{ background:transparent; color:var(--text-2); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn-row .btn-ghost{ flex:1; }
  .btn-row .btn-primary{ flex:1.5; }

  .badge{ display:inline-flex; padding:7px 14px; border-radius:999px; background:var(--accent-soft); border:1px solid var(--accent-line); font-size:13px; font-weight:700; }
  .client-line{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .client-name{ font-size:16px; font-weight:700; }
  .client-meta{ font-size:12px; color:var(--text-3); }

  .hero-amount{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; padding:18px 20px; margin:16px 0; }
  .hero-amount .k{ font-size:11.5px; color:var(--text-2); font-weight:700; letter-spacing:0.3px; }
  .hero-amount .v{ font-family:var(--font-display); font-size:30px; font-weight:700; margin-top:2px; }

  .chart-card{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; padding:18px; }
  .leg-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border-soft); }
  .leg-row:first-child{ border-top:none; }
  .leg-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .leg-name{ flex:1; font-size:13px; color:var(--text-2); }
  .leg-pct{ font-size:13px; font-weight:700; width:38px; text-align:right; }
  .leg-val{ font-size:12px; color:var(--text-3); width:84px; text-align:right; }

  .foot-note{ font-size:11px; color:var(--text-3); line-height:1.55; margin-top:14px; }

  .aclass-card{ display:flex; flex-direction:column; gap:12px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; padding:16px; margin-bottom:12px; }
  .aclass-head{ display:flex; align-items:center; gap:10px; }
  .aclass-head .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .aclass-head .name{ flex:1; font-size:14px; font-weight:700; }
  .aclass-head .meta{ font-size:12.5px; color:var(--text-2); }
  .item{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface-3); border-radius:10px; }
  .bullet{ width:5px; height:5px; border-radius:50%; background:var(--text-3); flex-shrink:0; }

  .sublabel{ font-size:11px; color:var(--text-3); font-weight:700; letter-spacing:0.3px; }
  .tick{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-3); border-radius:10px; }
  .pct{ display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; }

  .print-summary{ display:none; }

  @media print{
    .brand, .shell{ display:none !important; }
    .print-summary{ display:block !important; }
    body{ background:#fff; color:#111; }
  }
</style>

<div class="page">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="13" stroke="#f5f7fa" stroke-width="1.6"/>
      <path d="M15 7L18 15L15 23L12 15Z" stroke="#f5f7fa" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <div style="display:flex; flex-direction:column; line-height:1.15;">
      <span class="word">Norte</span>
      <span class="tag">Protótipo funcional — calcula ao vivo</span>
    </div>
  </div>

  <div class="shell" id="shell"></div>
</div>

<div class="print-summary" id="printSummary"></div>

<script>
/* ---------- Dados do modelo ---------- */

var ASSET_CLASSES = [
  { key:'rfpos', label:'Renda fixa pós-fixada', color:'var(--s1)' },
  { key:'rfinfl', label:'Renda fixa inflação/pré', color:'var(--s2)' },
  { key:'acoesbr', label:'Ações Brasil', color:'var(--s3)' },
  { key:'fiis', label:'Fundos imobiliários', color:'var(--s4)' },
  { key:'intl', label:'Internacional', color:'var(--s5)' },
  { key:'alt', label:'Alternativos', color:'var(--s6)' },
  { key:'prev', label:'Previdência privada', color:'var(--s7)' }
];

var ALLOCATIONS = {
  'Conservador':        { rfpos:35, rfinfl:25, acoesbr:5,  fiis:10, intl:5,  alt:0,  prev:20 },
  'Moderado':            { rfpos:20, rfinfl:20, acoesbr:15, fiis:15, intl:12, alt:3,  prev:15 },
  'Moderado-Arrojado':   { rfpos:10, rfinfl:10, acoesbr:20, fiis:15, intl:20, alt:10, prev:15 },
  'Arrojado':            { rfpos:5,  rfinfl:5,  acoesbr:30, fiis:10, intl:30, alt:10, prev:10 }
};

var PROFILE_DESC = {
  'Conservador': 'Prioriza preservar o capital. Prefere previsibilidade a crescimento acelerado.',
  'Moderado': 'Busca equilíbrio entre proteção e crescimento, com oscilações moderadas.',
  'Moderado-Arrojado': 'Aceita oscilações relevantes na carteira em troca de mais crescimento no longo prazo.',
  'Arrojado': 'Prioriza crescimento de capital e tolera oscilações fortes no curto prazo.'
};

var ASSET_EXAMPLES = {
  rfpos: ['Tesouro Selic — via Tesouro Direto (liquidez diária, reserva)', 'CDB pós-fixado — checar % do CDI vigente antes de fechar'],
  rfinfl: ['Tesouro IPCA+ — via Tesouro Direto (prazo a confirmar na plataforma)', 'Debênture incentivada — isenta de IR, taxa negociada por emissão'],
  fiis: ['FII de tijolo — lajes corporativas / logística', 'FII de papel — recebíveis imobiliários'],
  intl: ['ETF S&P 500 (BDR)', 'ETF MSCI World'],
  alt: ['Fundo multimercado macro', 'Exposição a ouro via ETF'],
  prev: ['VGBL multimercado / 100% ações, conforme apetite', 'Regime regressivo — IR cai com o tempo, alinhado ao horizonte']
};

// Nota de fonte/data — só para classes com taxa que muda com frequência (renda fixa).
// Atualizar manualmente a cada nova consulta às bases.
var RF_REFERENCE_NOTE = 'Selic 14,00% a.a. e CDI ≈13,90% a.a. (Copom, 15/08/2026 — fonte: Banco Central/Copom). CDBs hoje giram entre 100% do CDI (bancos grandes) e até 150% do CDI (bancos médios/corretoras, liquidez menor) — fonte: levantamento de mercado, 06/08/2026. Confirmar taxa e vencimento vigentes antes de qualquer operação; este não é um preço firme.';

// Movimentos reais de mercado (B3, dados de 23/08/2026) — conteúdo estático informativo.
var ACOES_BR_ALTAS = [
  { t:'EMBJ3', n:'Embraer', p:'+8,6%' },
  { t:'PRIO3', n:'Prio', p:'+7,4%' },
  { t:'FLRY3', n:'Fleury', p:'+9,7%*' }
];
var ACOES_BR_QUEDAS = [
  { t:'HAPV3', n:'Hapvida', p:'-45,1%' },
  { t:'MGLU3', n:'Magazine Luiza', p:'-19,4%' },
  { t:'BBAS3', n:'Banco do Brasil', p:'-13,4%' }
];

var QUESTIONS = [
  {
    key:'horizonte', text:'Qual é o horizonte deste investimento?', type:'chips',
    options:[
      {v:'<1', label:'Até 1 ano', pts:0},
      {v:'1-3', label:'1 a 3 anos', pts:1},
      {v:'3-5', label:'3 a 5 anos', pts:2},
      {v:'5-10', label:'5 a 10 anos', pts:3},
      {v:'10+', label:'+10 anos', pts:4}
    ]
  },
  {
    key:'objetivo', text:'Qual é o objetivo principal com esse valor?', type:'chips',
    options:[
      {v:'preservar', label:'Preservar capital', pts:0},
      {v:'renda', label:'Gerar renda', pts:1},
      {v:'compra', label:'Grande compra', pts:1},
      {v:'aposentadoria', label:'Aposentadoria', pts:2},
      {v:'crescer', label:'Crescer patrimônio', pts:3}
    ]
  },
  {
    key:'conhecimento', text:'Qual seu nível de conhecimento em investimentos?', type:'opts',
    options:[
      {v:'nenhum', label:'Nenhum', pts:0},
      {v:'basico', label:'Básico (poupança, CDB)', pts:1},
      {v:'intermediario', label:'Intermediário (ações, fundos)', pts:2},
      {v:'avancado', label:'Avançado (derivativos, internacional)', pts:3}
    ]
  },
  {
    key:'patrimonio', text:'Esse valor representa quanto do seu patrimônio total?', type:'chips',
    options:[
      {v:'>60', label:'Mais de 60%', pts:0},
      {v:'30-60', label:'30% a 60%', pts:1},
      {v:'10-30', label:'10% a 30%', pts:2},
      {v:'<10', label:'Menos de 10%', pts:3}
    ]
  },
  {
    key:'liquidez', text:'Você precisa poder acessar esse dinheiro com frequência?', type:'opts',
    options:[
      {v:'frequente', label:'Sim, preciso de acesso frequente', pts:0},
      {v:'parcial', label:'Posso precisar de parte em até 1 ano', pts:1},
      {v:'nao', label:'Não, posso deixar parado totalmente', pts:2}
    ]
  },
  {
    key:'perda', text:'Se sua carteira caísse 20% em 3 meses, você:', type:'opts',
    options:[
      {v:'vendetudo', label:'Venderia tudo', pts:0},
      {v:'vendeparte', label:'Venderia parte', pts:1},
      {v:'mantem', label:'Manteria a posição', pts:2},
      {v:'aporta', label:'Aportaria mais', pts:3}
    ]
  }
];

var MAX_SCORE = QUESTIONS.reduce(function(sum,q){
  return sum + Math.max.apply(null, q.options.map(function(o){ return o.pts; }));
}, 0);

/* ---------- Estado ---------- */

var state = {
  step: 1,
  client: { name:'Marina Torres', age:'34', amount:250000 },
  answers: { horizonte:'5-10', objetivo:'crescer', conhecimento:'intermediario', patrimonio:'10-30', liquidez:'nao', perda:'mantem' }
};

/* ---------- Utilidades ---------- */

function brl(n){
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL', minimumFractionDigits:0, maximumFractionDigits:0 });
}

function scoreOf(answers){
  var total = 0;
  QUESTIONS.forEach(function(q){
    var chosen = answers[q.key];
    if(!chosen) return;
    var opt = q.options.find(function(o){ return o.v === chosen; });
    if(opt) total += opt.pts;
  });
  return total;
}

function classify(score){
  var r1 = Math.round(MAX_SCORE * 5/18);
  var r2 = Math.round(MAX_SCORE * 10/18);
  var r3 = Math.round(MAX_SCORE * 14/18);
  if(score <= r1) return 'Conservador';
  if(score <= r2) return 'Moderado';
  if(score <= r3) return 'Moderado-Arrojado';
  return 'Arrojado';
}

function answeredCount(){
  return QUESTIONS.filter(function(q){ return !!state.answers[q.key]; }).length;
}

function currentProfile(){
  return classify(scoreOf(state.answers));
}

function donutSVG(alloc){
  var order = ASSET_CLASSES.map(function(a){ return a.key; });
  var C = 2 * Math.PI * 70;
  var acc = 0;
  var circles = order.map(function(key){
    var pct = alloc[key] || 0;
    var len = (pct/100) * C;
    var drawn = Math.max(len - 2, 0);
    var rem = C - drawn;
    var offset = -acc;
    acc += len;
    var color = ASSET_CLASSES.find(function(a){ return a.key===key; }).color;
    if(pct <= 0) return '';
    return '<circle cx="100" cy="100" r="70" fill="none" stroke="'+color+'" stroke-width="26" ' +
      'stroke-dasharray="'+drawn.toFixed(2)+' '+rem.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'"/>';
  }).join('');
  var nClasses = order.filter(function(k){ return (alloc[k]||0) > 0; }).length;
  return '<svg width="200" height="200" viewBox="0 0 200 200">' +
    '<circle cx="100" cy="100" r="70" fill="none" stroke="var(--surface-3)" stroke-width="26"/>' +
    '<g transform="rotate(-90 100 100)">' + circles + '</g>' +
    '<text x="100" y="96" text-anchor="middle" fill="var(--text)" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700">'+nClasses+'</text>' +
    '<text x="100" y="116" text-anchor="middle" fill="var(--text-3)" font-family="Manrope, sans-serif" font-size="11">classes de ativo</text>' +
    '</svg>';
}

function setStep(n){ state.step = n; render(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ---------- Render por etapa ---------- */

function renderStep1(){
  return ''+
  '<h1 class="title">Novo cliente</h1>'+
  '<p class="sub">Preencha os dados abaixo para iniciar o perfil de suitability e montar a carteira sugerida.</p>'+
  '<div style="margin-top:20px;">'+
    '<div class="field">'+
      '<label for="f-name">NOME DO CLIENTE</label>'+
      '<input id="f-name" type="text" value="'+state.client.name.replace(/"/g,'&quot;')+'" oninput="state.client.name=this.value">'+
    '</div>'+
    '<div style="display:flex; gap:14px;">'+
      '<div class="field" style="flex:1;">'+
        '<label for="f-age">IDADE</label>'+
        '<input id="f-age" type="text" inputmode="numeric" value="'+state.client.age+'" oninput="state.client.age=this.value.replace(/[^0-9]/g,\'\')">'+
      '</div>'+
    '</div>'+
    '<div class="field money">'+
      '<label for="f-amount">VALOR DISPONÍVEL PARA INVESTIR</label>'+
      '<input id="f-amount" type="text" inputmode="numeric" value="'+brl(state.client.amount)+'" oninput="handleAmountInput(this)">'+
      '<span class="hint">Você poderá ajustar esse valor mais tarde.</span>'+
    '</div>'+
  '</div>'+
  '<div class="btn-row">'+
    '<button class="btn btn-primary" style="flex:1;" onclick="setStep(2)">Iniciar perfil de suitability →</button>'+
  '</div>';
}

function renderQuestion(q){
  var chosen = state.answers[q.key];
  if(q.type === 'chips'){
    var chips = q.options.map(function(o){
      var on = chosen === o.v;
      return '<button type="button" class="chip" aria-pressed="'+on+'" onclick="setAnswer(\''+q.key+'\',\''+o.v+'\')">'+o.label+'</button>';
    }).join('');
    return '<div class="qcard"><div class="qtext">'+q.text+'</div><div class="chips">'+chips+'</div></div>';
  }
  var opts = q.options.map(function(o){
    var on = chosen === o.v;
    return '<button type="button" class="opt" aria-pressed="'+on+'" onclick="setAnswer(\''+q.key+'\',\''+o.v+'\')">'+
      '<span class="dot"></span><span>'+o.label+'</span></button>';
  }).join('');
  return '<div class="qcard"><div class="qtext">'+q.text+'</div><div class="opts">'+opts+'</div></div>';
}

function renderStep2(){
  var n = answeredCount(), total = QUESTIONS.length;
  var pct = Math.round((n/total)*100);
  var qs = QUESTIONS.map(renderQuestion).join('');
  return ''+
  '<div class="stephead">'+
    '<button class="backbtn" onclick="setStep(1)" aria-label="Voltar">'+chevronLeft()+'</button>'+
    '<h1 class="title" style="font-size:19px;">Perfil de investidor</h1>'+
  '</div>'+
  '<div class="progress-row">'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>'+
    '<span class="progress-label">'+n+' de '+total+'</span>'+
  '</div>'+
  qs+
  '<div class="btn-row">'+
    '<button class="btn btn-primary" '+(n<total?'disabled':'')+' onclick="setStep(3)">Ver carteira sugerida →</button>'+
  '</div>';
}

function renderStep3(){
  var profile = currentProfile();
  var alloc = ALLOCATIONS[profile];
  var amount = state.client.amount;
  var legend = ASSET_CLASSES.map(function(a){
    var pct = alloc[a.key] || 0;
    if(pct <= 0) return '';
    var val = Math.round(amount * pct/100);
    return '<div class="leg-row"><div class="leg-dot" style="background:'+a.color+';"></div>'+
      '<span class="leg-name">'+a.label+'</span>'+
      '<span class="leg-pct">'+pct+'%</span>'+
      '<span class="leg-val tabular">'+brl(val)+'</span></div>';
  }).join('');

  return ''+
  '<div class="stephead">'+
    '<button class="backbtn" onclick="setStep(2)" aria-label="Voltar">'+chevronLeft()+'</button>'+
    '<h1 class="title" style="font-size:19px;">Carteira sugerida</h1>'+
  '</div>'+
  '<div class="client-line" style="margin-top:16px;">'+
    '<div><div class="client-name">'+(state.client.name||'Cliente')+'</div>'+
    '<div class="client-meta">'+(state.client.age?state.client.age+' anos · ':'')+'calculado agora</div></div>'+
  '</div>'+
  '<div style="margin:14px 0 6px;"><span class="badge">Perfil: '+profile+'</span></div>'+
  '<p class="sub">'+PROFILE_DESC[profile]+'</p>'+
  '<div class="hero-amount"><div class="k">VALOR TOTAL A INVESTIR</div><div class="v tabular">'+brl(amount)+'</div></div>'+
  '<div class="chart-card">'+
    '<div style="display:flex; justify-content:center;">'+donutSVG(alloc)+'</div>'+
    '<div>'+legend+'</div>'+
  '</div>'+
  '<p class="foot-note">Alocação sugerida com base no perfil apurado no questionário. Conteúdo informativo — rentabilidade passada não garante resultado futuro.</p>'+
  '<div class="btn-row"><button class="btn btn-primary" style="flex:1;" onclick="setStep(4)">Ver ativos sugeridos →</button></div>';
}

function tickRow(item, kind){
  var color = kind==='up' ? 'var(--good)' : 'var(--critical)';
  var arrow = kind==='up'
    ? '<path d="M5 8V2M5 2L2 5M5 2L8 5" stroke="'+color+'" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M5 2V8M5 8L2 5M5 8L8 5" stroke="'+color+'" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>';
  return '<div class="tick"><span style="font-size:13px; font-weight:700; width:52px;">'+item.t+'</span>'+
    '<span style="flex:1; font-size:12px; color:var(--text-3);">'+item.n+'</span>'+
    '<span class="pct" style="color:'+color+';"><svg width="10" height="10" viewBox="0 0 10 10">'+arrow+'</svg>'+item.p+'</span></div>';
}

function renderStep4(){
  var profile = currentProfile();
  var alloc = ALLOCATIONS[profile];
  var amount = state.client.amount;

  var cards = ASSET_CLASSES.map(function(a){
    var pct = alloc[a.key] || 0;
    var val = Math.round(amount * pct/100);
    var metaLine = pct+'% · '+brl(val);

    if(a.key === 'acoesbr'){
      var altasHtml = ACOES_BR_ALTAS.map(function(x){ return tickRow(x,'up'); }).join('');
      var quedasHtml = ACOES_BR_QUEDAS.map(function(x){ return tickRow(x,'down'); }).join('');
      return '<div class="aclass-card">'+
        '<div class="aclass-head"><div class="dot" style="background:'+a.color+';"></div><span class="name">'+a.label+'</span><span class="meta">'+metaLine+'</span></div>'+
        '<span class="sublabel">MAIORES ALTAS · 3 MESES</span>'+altasHtml+
        '<span class="sublabel">MAIORES QUEDAS · 3 MESES</span>'+quedasHtml+
        '<span class="sublabel">LEITURA · PONTOS DE ENTRADA</span>'+
        '<p style="margin:0; font-size:12px; color:var(--text-2); line-height:1.55;">Entre as altas, PRIO3 e FLRY3 negociam a múltiplos mais moderados (P/L ~14x) que EMBJ3 (~31x), já bastante precificada após o rali.</p>'+
        '<p style="margin:0; font-size:12px; color:var(--text-2); line-height:1.55;">Entre as quedas, nenhuma mostra sinal técnico claro de reversão até o momento — leitura de acompanhamento, não de compra imediata.</p>'+
        '<p style="margin:0; font-size:10.5px; color:var(--text-3); line-height:1.5;">*Reação ao balanço do 2T26 (13/ago). Dados de mercado sujeitos a mudança — não é recomendação de compra ou venda.</p>'+
        '</div>';
    }

    if(pct <= 0){
      return '<div class="aclass-card">'+
        '<div class="aclass-head"><div class="dot" style="background:'+a.color+';"></div><span class="name">'+a.label+'</span><span class="meta">não alocado neste perfil</span></div>'+
        '</div>';
    }

    var examples = (ASSET_EXAMPLES[a.key]||[]).map(function(ex){
      return '<div class="item"><div class="bullet"></div><span style="font-size:13px; color:var(--text-2);">'+ex+'</span></div>';
    }).join('');

    var note = (a.key === 'rfpos' || a.key === 'rfinfl')
      ? '<p style="margin:0; font-size:10.5px; color:var(--text-3); line-height:1.5;">'+RF_REFERENCE_NOTE+'</p>'
      : '';

    return '<div class="aclass-card">'+
      '<div class="aclass-head"><div class="dot" style="background:'+a.color+';"></div><span class="name">'+a.label+'</span><span class="meta">'+metaLine+'</span></div>'+
      examples+
      note+
      '</div>';
  }).join('');

  return ''+
  '<div class="stephead">'+
    '<button class="backbtn" onclick="setStep(3)" aria-label="Voltar">'+chevronLeft()+'</button>'+
    '<h1 class="title" style="font-size:19px;">Ativos sugeridos</h1>'+
  '</div>'+
  '<div class="client-line" style="margin-top:16px;">'+
    '<div><div class="client-name">'+(state.client.name||'Cliente')+'</div>'+
    '<div class="client-meta">Perfil '+profile+' · '+brl(amount)+'</div></div>'+
  '</div>'+
  '<p class="sub">Exemplos ilustrativos dentro de cada classe. Ajuste conforme disponibilidade e liquidez do momento.</p>'+
  '<div style="margin-top:16px;">'+cards+'</div>'+
  '<div class="btn-row">'+
    '<button class="btn btn-ghost" onclick="setStep(2)">Editar perfil</button>'+
    '<button class="btn btn-primary" onclick="gerarProposta()">Gerar proposta em PDF</button>'+
  '</div>'+
  '<div class="btn-row"><button class="btn btn-ghost" style="flex:1;" onclick="restart()">Recomeçar com outro cliente</button></div>';
}

function chevronLeft(){
  return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="var(--text-2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* ---------- Ações ---------- */

function handleAmountInput(el){
  var digits = el.value.replace(/[^0-9]/g,'');
  var value = digits ? parseInt(digits,10) : 0;
  state.client.amount = value;
  el.value = brl(value);
  // Re-render only the amount-dependent parts if we were on step 3/4 later; on step 1 just keep input.
}

function setAnswer(key, val){
  state.answers[key] = val;
  render();
}

function restart(){
  state = {
    step: 1,
    client: { name:'', age:'', amount:0 },
    answers: { horizonte:null, objetivo:null, conhecimento:null, patrimonio:null, liquidez:null, perda:null }
  };
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function gerarProposta(){
  buildPrintSummary();
  window.print();
}

function buildPrintSummary(){
  var profile = currentProfile();
  var alloc = ALLOCATIONS[profile];
  var amount = state.client.amount;
  var rows = ASSET_CLASSES.map(function(a){
    var pct = alloc[a.key] || 0;
    if(pct<=0) return '';
    var val = Math.round(amount*pct/100);
    return '<tr><td style="padding:6px 8px; border-bottom:1px solid #ddd;">'+a.label+'</td>'+
      '<td style="padding:6px 8px; border-bottom:1px solid #ddd; text-align:right;">'+pct+'%</td>'+
      '<td style="padding:6px 8px; border-bottom:1px solid #ddd; text-align:right;">'+brl(val)+'</td></tr>';
  }).join('');
  document.getElementById('printSummary').innerHTML =
    '<div style="font-family:Manrope,sans-serif; max-width:680px; margin:40px auto; color:#111;">'+
    '<h1 style="font-family:\'Space Grotesk\',sans-serif; font-size:24px; margin:0 0 4px;">Norte — Proposta de carteira</h1>'+
    '<p style="color:#555; margin:0 0 24px;">Gerado em '+new Date().toLocaleDateString('pt-BR')+'</p>'+
    '<p><strong>Cliente:</strong> '+(state.client.name||'—')+' &nbsp; <strong>Idade:</strong> '+(state.client.age||'—')+
    ' &nbsp; <strong>Perfil:</strong> '+profile+'</p>'+
    '<p><strong>Valor total a investir:</strong> '+brl(amount)+'</p>'+
    '<table style="width:100%; border-collapse:collapse; margin-top:16px;"><thead><tr>'+
    '<th style="text-align:left; padding:6px 8px; border-bottom:2px solid #111;">Classe</th>'+
    '<th style="text-align:right; padding:6px 8px; border-bottom:2px solid #111;">%</th>'+
    '<th style="text-align:right; padding:6px 8px; border-bottom:2px solid #111;">Valor</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p style="font-size:12px; color:#777; margin-top:24px;">Conteúdo informativo, não constitui recomendação de investimento. Rentabilidade passada não garante resultado futuro.</p>'+
    '</div>';
}

/* ---------- Render principal ---------- */

function render(){
  var html;
  if(state.step === 1) html = renderStep1();
  else if(state.step === 2) html = renderStep2();
  else if(state.step === 3) html = renderStep3();
  else html = renderStep4();
  document.getElementById('shell').innerHTML = html;
}

render();
</script>
